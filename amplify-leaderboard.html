<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apertera Amplify Challenge - Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Vollkorn:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#050e1e;
    --flux:#0d7e89;
    --paper:#f2efe1;
    --line:#d8d4c4;
    --muted:#657086;
    --orange:#e7651a;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
    background:#f7f8fc;
    color:var(--ink);
    min-height:100vh;
    padding:44px 30px;
    -webkit-font-smoothing:antialiased;
  }
  .container{max-width:1630px;margin:0 auto}
  .header{text-align:center;margin-bottom:78px}
  .eyebrow{
    color:var(--flux);
    font-size:30px;
    font-weight:700;
    letter-spacing:9px;
    text-transform:uppercase;
    margin-bottom:28px;
  }
  h1{
    font-family:'Vollkorn',Georgia,serif;
    font-size:clamp(58px,6vw,92px);
    line-height:.98;
    margin:0;
  }
  .table-card{background:transparent}
  table{width:100%;border-collapse:collapse}
  thead th{
    padding:0 30px 26px;
    text-align:left;
    border-bottom:2px solid var(--flux);
    font-size:30px;
    font-weight:700;
  }
  th.rank{width:340px;color:var(--flux)}
  th.employee{color:var(--orange)}
  th.points{text-align:right;color:var(--flux)}
  tbody tr{border-bottom:1px solid var(--line)}
  tbody tr:last-child{border-bottom:2px solid var(--flux)}
  td{padding:33px 30px;vertical-align:middle}
  td.rank{
    font-family:'Vollkorn',Georgia,serif;
    font-size:32px;
    font-weight:700;
    color:var(--muted);
  }
  td.name a{
    font-family:'Vollkorn',Georgia,serif;
    font-size:34px;
    font-weight:700;
    color:var(--ink);
    text-decoration:none;
  }
  td.name a:hover{text-decoration:underline}
  td.points{
    text-align:right;
    font-family:'Vollkorn',Georgia,serif;
    font-size:34px;
    font-weight:700;
    color:var(--orange);
  }
  .loading,.error{
    padding:44px 18px;
    text-align:center;
    color:var(--muted);
    border-top:2px solid var(--flux);
    border-bottom:2px solid var(--flux);
  }
  .error{color:#a63a3a}
  @media (max-width:720px){
    body{padding:30px 14px}
    .header{margin-bottom:44px}
    .eyebrow{font-size:18px;letter-spacing:6px}
    .table-card{overflow-x:auto}
    table{min-width:560px}
    thead th{font-size:18px;padding:0 18px 18px}
    th.rank{width:110px}
    td{padding:24px 18px}
    td.rank,td.name a,td.points{font-size:24px}
  }
</style>
</head>
<body>
<main class="container">
  <header class="header">
    <div class="eyebrow">Leaderboard</div>
    <h1>Current Standings</h1>
  </header>
  <section class="table-card" id="leaderboardWrap">
    <div class="loading">Loading leaderboard...</div>
  </section>
</main>
<script>
const fmt = value => Number(value || 0).toLocaleString('en-US');
const escapeHTML = value => String(value || '')
  .replace(/&/g, '&amp;')
  .replace(/</g, '&lt;')
  .replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;')
  .replace(/'/g, '&#039;');
function renderTable(rows){
  if(!rows.length) return '<div class="loading">No leaderboard rows yet.</div>';
  return `<table>
    <thead><tr><th class="rank">Rank</th><th class="employee">Employee</th><th class="points">Points</th></tr></thead>
    <tbody>${rows.map(row=>`<tr>
      <td class="rank">${fmt(row.rank)}</td>
      <td class="name"><a href="${escapeHTML(row.profile_url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(row.full_name)}</a></td>
      <td class="points">${fmt(row.total_points)}</td>
    </tr>`).join('')}</tbody>
  </table>`;
}
async function loadLeaderboard(){
  try{
    const response = await fetch('/api/amplify-public');
    const data = await response.json();
    if(!response.ok) throw new Error(data.error || 'Could not load leaderboard.');
    const rows = data.leaderboard || [];
    document.getElementById('leaderboardWrap').innerHTML = renderTable(rows);
  }catch(error){
    document.getElementById('leaderboardWrap').innerHTML = `<div class="error">${escapeHTML(error.message)}</div>`;
  }
}
loadLeaderboard();
</script>
</body>
</html>
